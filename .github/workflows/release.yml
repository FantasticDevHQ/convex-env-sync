name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z to recover (dispatch at that exact tag ref)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    name: Release PR
    if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GITHUB_TOKEN creates tags/releases without triggering a second publish run.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: FantasticDevHQ
          repositories: convex-env-sync
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # App-created release PRs trigger normal protected CI.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release-pr.outputs.prs_created == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release-pr.outputs.prs_created == 'true'
        with:
          node-version: 24
      # `prs_created` is true whenever Release Please created or updated the
      # release PR. Release PRs meet the PR standard with no bot exemption: the
      # step writes the required sections, amends the release commit with a
      # `No-ticket: automated release` footer and force-pushes it with a lease
      # using the App token (so CI runs on the new head), then pins auto-merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release-pr.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          path: .release-pr
          fetch-depth: 2 # the release commit and its parent, for the amend
          persist-credentials: false
      - name: Validate generated metadata and enable protected auto-merge
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ steps.release-pr.outputs.pr }}
        run: node scripts/release/pr.mjs .release-pr

  verify-release:
    name: Verify release
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (startsWith(github.ref, 'refs/tags/v') && needs.release-please.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v')))
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify tag, workflow source, version and changelog
        run: node scripts/release/artifact.mjs check
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack and audit the exact verified source
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
        run: node scripts/release/artifact.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifact
          path: ${{ runner.temp }}/release-artifact/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [release-please, verify-release]
    if: always() && !cancelled() && needs.verify-release.result == 'success'
    # Owner-approved publishing-only exception: npm OIDC/provenance rejects self-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm trusted publishing support
        run: node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: ${{ runner.temp }}/release-artifact
      # No install/build/lifecycle scripts on the publisher. It audits every archive file against the tag.
      - name: Publish once and verify public integrity and provenance
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
        run: node scripts/release/publish.mjs
      - name: Create GitHub release for a manual tag if absent
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
