name: Check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Repository quality gates
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.18.0
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository tooling
        run: node scripts/check.mjs
      - name: Verify backend-free lifecycle
        run: |
          node scripts/worktree/cli.mts setup
          node scripts/worktree/cli.mts start
          node scripts/worktree/cli.mts stop
          node scripts/worktree/cli.mts teardown
          node scripts/worktree/cli.mts cleanup --yes
      - name: Clean owned state
        if: always()
        run: node scripts/worktree/cli.mts cleanup --yes
